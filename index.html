<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />

        <title>Test presentation</title>

        <link rel="stylesheet" href="dist/reset.css" />
        <link rel="stylesheet" href="dist/reveal.css" />
        <link rel="stylesheet" href="dist/theme/black.css" />

        <!-- Theme used for code editor -->
        <link rel="stylesheet" href="dist/plugin/code-editor.css">
    </head>
    <body>
        <div class="reveal">
            <div class="slides">
                <section>Slide 1</section>

                <section>Slide 2</section>

                <section>
                    <h2>L<h2>Code editor test [C++]</h2></h2>
                    <pre><code contenteditable="false" class="language-cpp" data-trim data-noescape data-line-numbers="|1|3|4|6">
#include &lt;iostream&gt;

int main() {
    std::cout &lt;&lt; "Hello, World!" &lt;&lt; std::endl;

    return 0;
}
                    </code></pre>
                </section>
            </div>
        </div>

        <script src="dist/reveal.js"></script>
        <script src="dist/plugin/notes.js"></script>
        <script src="dist/plugin/markdown.js"></script>
        <script src="dist/plugin/code-editor.js"></script>
        <script>
            // More info about initialization & config:
            // - https://revealjs.com/initialization/
            // - https://revealjs.com/config/
            const codeEditor = CodeEditor();
            Reveal.initialize({
            hash: true,
                    width: 1024,
                    // center: false,
                    plugins: [RevealMarkdown, RevealNotes, codeEditor],
                });
            window.codeSourceProvider = codeEditor.sourceProvider;
        </script>
    </body>
</html>
